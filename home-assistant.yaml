# ===== À coller dans configuration.yaml, puis redémarrer HA =====

rest_command:
  tv_notify:
    url: "http://192.168.1.190:8765/notify"
    method: POST
    content_type: "application/json; charset=utf-8"
    payload: >-
      {"title": {{ title | tojson }},
       "message": {{ (message | default("")) | tojson }},
       "duration": {{ duration | default(8) }},
       "camera": {{ (camera | default("")) | tojson }}}
  tv_launch:
    url: "http://192.168.1.190:8765/launch"
    method: POST
    content_type: "application/json; charset=utf-8"
    payload: '{"package": {{ package | tojson }}}'

rest:
  - resource: "http://192.168.1.190:8765/state"
    scan_interval: 10
    sensor:
      - name: "Bbox appli en cours"
        unique_id: bbox_app_en_cours
        value_template: "{{ value_json.app_name }}"
        json_attributes:
          - app
    binary_sensor:
      - name: "Bbox écran allumé"
        unique_id: bbox_ecran_allume
        value_template: "{{ value_json.screen_on }}"

